{% extends 'base.html' %}{% block content %}<section><h2>登録・ログイン</h2><p>登録は無料です。商品登録にはテスト決済が必要です。パスワード再発行は未対応のため、試作には個人情報を使わないでください。</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>ユーザー名（半角英数字・_・-、3〜40文字）<input name="name" autocomplete="username" required minlength="3" maxlength="40"></label><label>パスワード（12〜128文字）<input name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128"></label><button name="action" value="register">新しく登録</button> <button name="action" value="login">ログイン</button></form></section>{% endblock %}
