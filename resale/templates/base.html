<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>出品・手残り管理</title>
<style>body{font:16px/1.6 sans-serif;background:#f3f6f7;color:#203337;max-width:1000px;margin:auto;padding:20px;overflow-wrap:anywhere}section,article{background:white;border-radius:12px;padding:22px;margin:18px 0}input,textarea,select,button{font:inherit;padding:9px;max-width:100%;box-sizing:border-box}input,textarea,select{display:block;width:100%}textarea{width:100%}button,.button{background:#086c66;color:white;border:0;border-radius:6px;cursor:pointer;padding:10px 16px;display:inline-block;min-height:44px}label{display:block;margin:12px 0}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}.notice{background:#fff3cf;padding:12px}.muted{color:#51646a}.row{display:flex;gap:12px;flex-wrap:wrap}.row label{flex:1 1 200px;min-width:0}pre{white-space:pre-wrap}a{color:#086c66}summary{cursor:pointer;min-height:44px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #da8b13;outline-offset:3px}@media(max-width:480px){body{padding:12px}section,article{padding:16px}h1{font-size:1.5rem}h2{font-size:1.25rem}.row{gap:4px}.row label{flex-basis:100%}}</style>
<header><h1>出品・手残り管理</h1><p class="muted">試作版・テスト決済のみ。相場調査・AI文章生成・メルカリへの自動出品は未対応です。</p><nav><a href="/">紹介</a> · {% if signed_in %}<a href="/workbench">商品一覧</a><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button>ログアウト</button></form>{% else %}<a href="/account">登録・ログイン</a>{% endif %}</nav></header>
{% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}
<main>{% block content %}{% endblock %}</main><footer><p>非公式の出品準備ツールです。価格・売却・収益を保証しません。金額は送料・梱包費と販売手数料10%を使った概算です。</p></footer><script defer src="{{ url_for('static', filename='copy.js') }}"></script></html>
