{% extends 'base.html' %}{% block content %}<section><h2>パスワードを再設定</h2><p>登録時に保管した復旧コードで再設定できます。成功すると以前のログイン状態は無効になり、復旧コードも新しくなります。</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>ユーザー名<input name="name" required autocomplete="username" maxlength="40"></label><label>復旧コード<input name="recovery" required minlength="43" maxlength="43" autocomplete="off"></label><label>新しいパスワード<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><button>再設定する</button></form><p>復旧コードも失った場合の本人確認・復旧手順は、販売前に別途整備が必要です。</p></section>{% endblock %}
